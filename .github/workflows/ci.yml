name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # next-env.d.ts is gitignored and normally regenerated by `next dev`/`next build`.
      # tsc needs it for next/image, typed routes, etc., so seed a minimal version.
      - name: Seed next-env.d.ts
        run: |
          cat > next-env.d.ts <<'EOF'
          /// <reference types="next" />
          /// <reference types="next/image-types/global" />
          /// <reference types="next/navigation-types/compat/navigation" />
          EOF

      - name: Typecheck
        run: bun run typecheck

      # NOTE: `bun run lint` (biome + eslint + prettier) is intentionally not a
      # blocking gate yet — the codebase has ~264 pre-existing lint errors
      # accumulated before this gate existed (mostly in tests/ and scripts/).
      # Adding it as a gate now would block every PR. Re-enable once the
      # baseline is cleaned up via `bun run lint:fix` + manual review.
