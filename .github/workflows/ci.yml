name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # next-env.d.ts is gitignored and normally regenerated by `next dev`/`next build`.
      # tsc needs it for next/image, typed routes, etc., so seed a minimal version.
      - name: Seed next-env.d.ts
        run: |
          cat > next-env.d.ts <<'EOF'
          /// <reference types="next" />
          /// <reference types="next/image-types/global" />
          /// <reference types="next/navigation-types/compat/navigation" />
          EOF

      - name: Typecheck
        run: bun run typecheck

      # Guards TOH icon files against being overwritten by upstream Shipkit
      # syncs (LAC-3976: sync #297 re-added Shipkit's icon.svg and the
      # browser tab showed the rocket instead of the TOH "H").
      - name: Branding check
        run: bun run check:branding

      # Formatting IS a gate. Prettier is the single formatter of record
      # (LAC-4312); run `bun run format` to fix. This is gateable because the
      # whole repo was reformatted clean, unlike the lint rules below.
      - name: Format check
        run: bun run format:check

      # NOTE: `bun run lint` (biome lint + eslint) is intentionally not a
      # blocking gate yet — the codebase has pre-existing lint errors
      # accumulated before this gate existed (90 biome + 222 eslint as of
      # 2026-10-13, mostly in tests/ and scripts/). Adding it as a gate now
      # would block every PR. Tracked in LAC-3629 and LAC-3562; re-enable
      # once that baseline is cleaned up.
