# Dependabot keeps dependencies current on a routine schedule so upgrades land
# as small, reviewable PRs instead of one big painful sweep (see LAC-3319).
#
# How it works: Dependabot opens grouped PRs every Monday. Minor/patch bumps are
# batched into a single PR per ecosystem to avoid noise; major bumps open on their
# own so they get individual review. CI (ci.yml, e2e.yml) gates every PR.
#
# Bun note: the root lockfile is `bun.lock`, so the root entry has to be
# `package-ecosystem: "bun"`. The `npm_and_yarn` ecosystem cannot update
# `bun.lock`: it hard-errors with `misconfigured_tooling` and aborts during file
# fetching, so the root entry never opened a single PR until this was corrected
# (see LAC-4108, and LAC-4106 for the same bug upstream in shipkit).
version: 2
updates:
  # App JavaScript dependencies (root package.json), resolved through bun.lock.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # One PR for all safe (minor + patch) production dependency bumps
      production-minor-patch:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      # One PR for all dev dependency bumps
      development:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # Major bumps of framework-critical packages get opened individually (not
    # grouped), but never auto-batched with the rest — they always need a human.

    # Majors that were reviewed and declined during the LAC-4115 triage. Each one
    # needs migration work that Dependabot cannot do, and left alone each one
    # re-opens every Monday and eats a slot in the 10-PR limit, which is what
    # starves the queue behind it. Delete the entry when its issue lands; that is
    # the signal the migration is done.
    ignore:
      # Tailwind v3 -> v4 is a config and API rewrite. Port shipkit-www's
      # finished migration rather than redoing it. LAC-4644.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # v2 renames CookieBanner/ConsentManagerDialog and drops hasConsentFor,
      # and consent is live in prod. LAC-3906.
      - dependency-name: "@c15t/nextjs"
        update-types: ["version-update:semver-major"]
      # engine and slim have to move together, and v4 drops options sparkles.tsx
      # passes. Fix belongs upstream in shipkit. LAC-4645.
      - dependency-name: "@tsparticles/engine"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tsparticles/slim"
        update-types: ["version-update:semver-major"]
      # overrides pins nanoid to ^3.3.18, so a major here installs nothing and
      # arrives with a green check. LAC-4646.
      - dependency-name: "nanoid"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used by the workflows in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
